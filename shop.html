<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14286B">
<link rel="manifest" href="shop-manifest.json">
<link rel="icon" href="icon-192.png">
<title>تأمین گستر وستا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--cr:#FBF8F1;--nv:#14286B;--gd:#B8892B;--gl:#C9A24B;--gs:#F3E6C4;--ink:#0E1B45;--mt:#6B7390;--ln:#E8E1CF;--rd:#C62828;--ok:#1F7A4D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--cr);color:var(--ink);font-family:Tahoma,Vazirmatn,sans-serif;font-size:15px;line-height:1.7;padding-bottom:90px}
button{font:inherit;cursor:pointer}input{font:inherit}
.hd{position:sticky;top:0;z-index:10;background:var(--nv);padding:10px 14px 12px;border-bottom:3px solid var(--gl);color:#fff}
.tp{display:flex;align-items:center;gap:10px}.tp img{width:46px;height:46px;border-radius:50%;border:2px solid var(--gl);background:#fff}
.tp b{flex:1;font-size:17px}.tp small{display:block;font-weight:normal;font-size:12px;color:var(--gl)}
.bell{position:relative;background:rgba(255,255,255,.12);border:0;color:#fff;width:42px;height:42px;border-radius:12px;font-size:20px}
.bell i{position:absolute;top:4px;left:4px;background:var(--rd);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;line-height:18px;text-align:center}
.sr{margin-top:10px}.sr input{width:100%;border:0;border-radius:12px;padding:11px 14px;background:#fff;color:var(--ink)}
.hero{margin:12px;border-radius:18px;padding:18px;background:linear-gradient(135deg,#14286B,#24408f);color:#fff;border:2px solid var(--gl);position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:19px;color:var(--gl)}.hero p{margin:0;font-size:14px;opacity:.92}
.sec{display:flex;justify-content:space-between;align-items:center;padding:6px 14px}.sec h3{margin:0;font-size:16px}
.fl{background:linear-gradient(160deg,#14286B,#24408f);margin:10px 12px;padding:8px 0 4px;border-radius:18px;border:2px solid var(--gl)}.fl h3{color:var(--gl)}.cdb{background:var(--gl);color:var(--nv);font-weight:bold;border-radius:10px;padding:2px 10px;font-size:14px;direction:ltr}
.hs{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs .cd{min-width:150px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--ln);background:#fff;color:var(--ink);padding:7px 16px;border-radius:20px;font-size:14px}.chip.on{background:var(--nv);color:#fff;border-color:var(--nv)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.cd{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:8px;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 8px rgba(20,40,107,.06)}
.im{aspect-ratio:1;border-radius:12px;background:var(--gs);object-fit:cover;width:100%;display:grid;place-items:center;color:var(--gd);font-weight:bold}
.bd{position:absolute;top:12px;right:12px;background:var(--rd);color:#fff;font-size:12px;padding:0 8px;border-radius:10px;font-weight:bold}
.nm{font-size:13.5px;margin:6px 2px 2px;min-height:44px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.old{color:var(--mt);text-decoration:line-through;font-size:12px;min-height:18px}.pr{color:var(--nv);font-weight:bold;font-size:16px}.pr small{font-size:11px;font-weight:normal;color:var(--mt)}
.lw{font-size:11.5px;color:var(--rd);min-height:18px}.ct{font-size:11.5px;color:var(--rd);font-weight:bold}
.ad{margin-top:6px;border:0;background:var(--nv);color:#fff;border-radius:10px;padding:8px;font-weight:bold}.ad:disabled{background:#c9c9c9}
.st{display:flex;align-items:center;justify-content:space-between;margin-top:6px;background:var(--gs);border-radius:10px;padding:2px}
.st button{width:34px;height:34px;border:0;border-radius:8px;background:var(--nv);color:#fff;font-size:18px}.st b{color:var(--nv)}
#bar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--nv);color:#fff;border:2px solid var(--gl);border-radius:16px;padding:12px 16px;display:none;justify-content:space-between;z-index:20;border-width:2px;width:calc(100% - 24px);text-align:start}
.ov{position:fixed;inset:0;background:rgba(10,20,60,.55);z-index:30;display:none}.ov.on{display:block}
.sh{position:absolute;bottom:0;inset-inline:0;background:var(--cr);border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 10px;display:flex;justify-content:space-between}.x{border:0;background:var(--gs);border-radius:50%;width:32px;height:32px}
.li{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:8px;margin-bottom:8px}.li .im{width:56px;flex:none;font-size:11px}.li .st{width:110px;margin:0}
label{display:block;font-size:13px;color:var(--mt);margin:8px 0 2px}.fi{width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
.tt{display:flex;justify-content:space-between;font-weight:bold;font-size:16px;margin:10px 0 2px}.fr{color:var(--ok);font-size:13px}
.go{width:100%;margin-top:12px;border:0;background:var(--nv);color:#fff;padding:14px;border-radius:14px;font-weight:bold;font-size:16px;border-bottom:3px solid var(--gl)}
.er{color:var(--rd);font-size:13px;min-height:20px}.nt{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px}.nt small{color:var(--mt)}
.dn{text-align:center;padding:20px 0}.dn .ck{width:70px;height:70px;border-radius:50%;background:var(--ok);color:#fff;font-size:38px;line-height:70px;margin:0 auto 10px}
.em{text-align:center;color:var(--mt);padding:40px 14px}
.hb{position:absolute;top:10px;left:10px;border:0;background:rgba(255,255,255,.92);width:30px;height:30px;border-radius:50%;color:#bbb;font-size:16px;z-index:1}.hb.on{color:var(--rd)}
.sk{height:230px;background:linear-gradient(90deg,#eee,#f7f3e8,#eee);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.qa{display:flex;gap:8px;padding:0 12px 6px}.qa button{flex:1;border:1px solid var(--ln);background:#fff;color:var(--nv);border-radius:12px;padding:9px;font-weight:bold;font-size:13px}
.dt .im{aspect-ratio:1;max-height:300px;border-radius:16px;font-size:20px}.dt h2{font-size:17px;margin:10px 0 4px}.cd .im,.cd .nm{cursor:pointer}
a.go{display:block;text-align:center;text-decoration:none;margin-top:10px}a.go.wa{background:#1F7A4D}
.cr{display:flex;gap:12px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}.cc{flex:none;width:76px;text-align:center;background:none;border:0;color:var(--ink);font-size:12px;line-height:1.4}
.ci{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 4px;border-radius:50%;background:#fff;border:2px solid var(--gl);font-size:28px;overflow:hidden;box-shadow:0 2px 6px rgba(20,40,107,.12)}.cc.on .ci{background:var(--nv)}.cc.on small{font-weight:bold;color:var(--nv)}.ci img{width:100%;height:100%;object-fit:cover}
.bn{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 12px 10px;scrollbar-width:none}.bi{flex:none;width:85%;min-height:120px;scroll-snap-align:center;border-radius:16px;background:linear-gradient(135deg,var(--gl),var(--gd)) center/cover;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.bz{font-size:12px;color:var(--mt);min-height:18px}#of{position:fixed;top:0;inset-inline:0;z-index:50;background:var(--rd);color:#fff;text-align:center;padding:6px;font-size:13px}.nb{margin:0 12px 8px;background:var(--gs);border:1px solid var(--gl);border-radius:12px;padding:8px 12px;font-size:13px}
.stp{display:flex;gap:4px;margin:8px 0}.stp i{flex:1;height:6px;border-radius:3px;background:var(--ln)}.stp i.on{background:var(--ok)}details{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin-bottom:6px}summary{font-weight:bold;cursor:pointer}
#bar{display:none!important}.m2{font-size:13px;color:var(--mt)}.lw{color:var(--mt)}.lw.lo{color:var(--rd);font-weight:bold}.pg{padding:6px 14px}.pg h3 .x{display:none}
.iw{position:relative}.pl{position:absolute;left:6px;bottom:6px;width:36px;height:36px;border-radius:50%;border:2px solid var(--nv);background:#fff;color:var(--nv);font-size:22px;line-height:1;padding:0}
.iw .st{position:absolute;left:6px;bottom:6px;margin:0;background:#fff;border:2px solid var(--nv);border-radius:20px;padding:0}.iw .st button{width:30px;height:30px;font-size:16px}.iw .st b{padding:0 4px}
#nv{position:fixed;bottom:0;inset-inline:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:2px solid var(--gl);padding-bottom:env(safe-area-inset-bottom,0px)}
#nv button{background:none;border:0;padding:8px 0 6px;color:var(--mt);font-size:12px;position:relative}#nv i{display:block;font-style:normal;font-size:22px;filter:grayscale(1);opacity:.7;transition:transform .2s}
#nv button.on{color:var(--nv);font-weight:bold}#nv button.on i{filter:none;opacity:1;transform:scale(1.15)}#nv b{position:absolute;top:2px;right:calc(50% - 22px);background:var(--rd);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;line-height:18px}
body[data-p]:not([data-p=home]) .sr{display:none}.spin{animation:sp .6s linear}@keyframes sp{to{transform:rotate(360deg)}}
#sp{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#14286B,#0b1a4a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;transition:opacity .6s}#sp.out{opacity:0;pointer-events:none}
#sp img{width:120px;border-radius:50%;border:3px solid var(--gl);animation:pop .8s ease both}#sp b{color:var(--gl);font-size:20px;animation:up .8s .3s ease both}#sp .br{width:140px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}#sp .br i{display:block;height:100%;background:var(--gl);animation:ld 2s ease forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}@keyframes up{from{transform:translateY(12px);opacity:0}}@keyframes ld{from{width:0}to{width:100%}}@media (prefers-reduced-motion:reduce){#sp img,#sp b,#sp .br i{animation:none}#sp .br i{width:100%}}
.mn{flex:none;width:84px;text-align:center;background:none;border:0;color:var(--ink);font-size:11.5px;line-height:1.4}.mn img,.mn .mi{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 4px;border-radius:50%;object-fit:cover;border:2px solid var(--gl);background:var(--gs);color:var(--gd)}.mn small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}.mn b{display:block;color:var(--nv);font-size:12px}
</style>
</head>

function shHTML(k){let h="";const c=Object.entries(cart).map(([i,n])=>[P.find(x=>x.id==i),n]).filter(([x])=>x),tot=c.reduce((a,[x,n])=>a+n*pe(x),0),cons=c.reduce((a,[x,n])=>a+n*x.consumer_price,0),sav=cons-tot,pc=cons?Math.round(sav/cons*100):0,u=ls.g("vs_cu",{});
 if(k=="cart"){h=`<h3>سبد خرید <button class="x" onclick="closeSheet()">✕</button></h3>`;
  if(!c.length)h+=`<div class="em">سبد خرید خالی است.<br><button class="go" style="width:auto;padding:10px 24px" onclick="go('home')">رفتن به فروشگاه</button></div>`;else{
  h+=c.map(([x,n])=>`<div class="li">${x.image_url?`<img class="im" src="${esc(x.image_url)}" alt="">`:`<div class="im">وستا</div>`}<div style="flex:1;min-width:0"><div style="font-size:13px">${esc(x.name)}</div><div class="pr" style="font-size:14px">${fa(pe(x)*n)} <small>تومان</small></div></div><div class="st"><button onclick="chg(${x.id},1)">+</button><b>${fa(n)}</b><button onclick="chg(${x.id},-1)">−</button></div></div>`).join("");
  h+=`${sav>0?`<div class="nt"><div class="f sp"><span>جمع به قیمت مصرف‌کننده</span><span>${fa(cons)} تومان</span></div><div class="f sp" style="color:var(--ok)"><span>تخفیف وستا (${fa(pc)}٪)</span><span>− ${fa(sav)} تومان</span></div><div class="tt"><span>مبلغ قابل پرداخت</span><span>${fa(tot)} تومان</span></div></div><div class="fr" style="font-size:13px;line-height:1.9">سفارش شما ${fa(cons)} تومان می‌شد، ولی چون از وستا خرید می‌کنید، ${fa(sav)} تومان (${fa(pc)} درصد) تخفیف می‌گیرید و فقط ${fa(tot)} تومان پرداخت می‌کنید.</div>`:`<div class="tt"><span>مبلغ قابل پرداخت</span><span>${fa(tot)} تومان</span></div>`}<div class="fr">ارسال رایگان · پرداخت در محل هنگام تحویل</div>
  <label>نام و نام خانوادگی</label><input class="fi" id="cn" value="${esc(u.n||"")}"><label>شماره موبایل</label><input class="fi" id="cp" inputmode="tel" dir="ltr" placeholder="09123456789" value="${esc(u.p||"")}"><label>آدرس کامل</label>${(u.as||[]).length>1?`<select class="fi" style="margin-bottom:6px" onchange="$('#ca').value=this.value">${u.as.map(a=>`<option>${esc(a)}</option>`).join("")}</select>`:""}<input class="fi" id="ca" value="${esc(u.a||"")}"><label>زمان تحویل</label><select class="fi" id="ct"><option>در اسرع وقت</option><option>امروز عصر</option><option>فردا صبح</option><option>فردا عصر</option></select><label>توضیحات سفارش (اختیاری)</label><input class="fi" id="cm" maxlength="300"><div class="er">${esc(err)}</div><button class="go" id="go" onclick="order()">ثبت سفارش</button>`}}
 if(k=="profile"){h=`<h3>پروفایل</h3><div class="nt"><b>${esc(u.n||"مهمان")}</b><div class="m2">${esc(u.p||"شماره‌ای ثبت نشده")}</div>${(u.as||[]).map(a=>`<div class="m2">📍 ${esc(a)}</div>`).join("")}</div><div class="f"><button class="chip" onclick="cat='❤ علاقه‌مندی‌ها';go('home')">❤ علاقه‌مندی‌ها</button><button class="chip" onclick="openSheet('notif')">🔔 اعلان‌ها</button><button class="chip" onclick="hard()">⟳ پاک‌سازی و بارگذاری مجدد</button></div>`+shHTML("help")}
 if(k=="notif"){h=`<h3>اعلان‌ها <button class="x" onclick="closeSheet()">✕</button></h3>`+(N.length?N.map(n=>`<div class="nt"><b>${esc(n.title)}</b><div>${esc(n.body)}</div><small>${new Date(n.created_at).toLocaleDateString("fa-IR")}</small></div>`).join(""):`<div class="em">اعلانی وجود ندارد.</div>`)}
 if(k=="done")h=`<div class="dn"><div class="ck">✓</div><h3 style="display:block">سفارش شما ثبت شد</h3><p><b>شماره سفارش: ${fa(lastId)}</b></p><p>ممنون از اعتماد شما. همکاران ما به‌زودی با شما تماس می‌گیرند و سفارش با پیک ارسال می‌شود.</p><button class="go" onclick="closeSheet()">بازگشت به فروشگاه</button></div>`;
 if(k=="detail"){const x=P.find(y=>y.id==dtid),n=cart[x.id]||0,sm=P.filter(y=>y.category==x.category&&y.id!=x.id&&y.stock>0).slice(0,4);
 h=`<div class="dt"><h3><span></span><button class="x" onclick="closeSheet()">✕</button></h3>${x.image_url?`<img class="im" src="${esc(x.image_url)}" alt="">`:`<div class="im">وستا</div>`}<h2>${esc(x.name)}</h2><div class="fr" style="color:var(--mt)">${esc(x.category)}</div>
 <div class="bz">${esc([x.brand,x.size].filter(Boolean).join(" · "))}</div><div class="old">${dis(x)>0?fa(x.consumer_price)+" تومان · "+fa(dis(x))+"٪ تخفیف":""}</div>${dis(x)>0?`<div class="fr">صرفه‌جویی شما: ${fa(x.consumer_price-pe(x))} تومان</div>`:""}${x.description?`<p style="font-size:14px">${esc(x.description)}</p>`:""}<button class="x" style="width:auto;padding:0 12px" onclick="shr(${x.id})">اشتراک‌گذاری</button><div class="pr" style="font-size:22px">${fa(pe(x))} <small>تومان</small></div><div class="lw">${x.stock<=0?"ناموجود":x.stock<=x.low_alert?`تنها ${fa(x.stock)} عدد مانده`:"موجودی: "+fa(x.stock)+" عدد"}${fl(x)?` · پایان تخفیف: <span class="ct" data-e="${new Date(x.flash_ends).getTime()}">${cd(new Date(x.flash_ends)-Date.now())}</span>`:""}</div>
 ${x.stock<=0?`<button class="ad" disabled style="width:100%">ناموجود</button>`:n?`<div class="st"><button onclick="chg(${x.id},1)">+</button><b>${fa(n)}</b><button onclick="chg(${x.id},-1)">−</button></div>`:`<button class="ad" style="width:100%;padding:12px" onclick="chg(${x.id},1)">افزودن به سبد</button>`}
 ${sm.length?`<h3 style="margin-top:16px;display:block">کالاهای مشابه</h3><div class="gr" style="padding:0">${sm.map(card).join("")}</div>`:""}</div>`}
if(k=="orders"){const ST={new:"ثبت شد",preparing:"در حال آماده‌سازی",shipping:"تحویل پیک شد",delivered:"تحویل داده شد",cancelled:"لغو شد"},ord=["new","preparing","shipping","delivered"];h=`<h3>سفارش‌های من <button class="x" onclick="closeSheet()">✕</button></h3><label>شماره موبایل</label><div class="f"><input class="fi" id="tp" inputmode="tel" dir="ltr" value="${esc(u.p||"")}"><button class="x" style="width:auto;padding:0 14px" onclick="openOrders($('#tp').value)">نمایش</button></div><div class="er">${esc(msg)}</div>`+TR.map(o=>`<div class="nt"><b>سفارش ${fa(o.id)} · ${fa(o.total)} تومان</b><div style="color:var(--${o.status=="cancelled"?"rd":"ok"});font-weight:bold">${ST[o.status]}</div>${o.status!="cancelled"?`<div class="stp">${ord.map((k,i)=>`<i class="${i<=ord.indexOf(o.status)?"on":""}"></i>`).join("")}</div>`:""}<div style="font-size:13px">${(o.items||[]).map(i=>esc(i.name)+" × "+fa(i.qty)).join("، ")}</div>${o.status=="new"?`<button class="go" style="margin-top:8px;padding:9px;background:var(--rd)" onclick="cx(${o.id})">لغو سفارش</button>`:""}</div>`).join("")+(hist.length?`<h3 style="display:block;margin-top:12px">خرید مجدد</h3>`+hist.map((o,k)=>`<div class="nt"><b>${new Date(o.d).toLocaleDateString("fa-IR")} · ${fa(o.total)} تومان</b><div style="font-size:13px">${o.items.map(i=>esc(i.name)+" × "+fa(i.qty)).join("، ")}</div><button class="go" style="margin-top:8px;padding:9px" onclick="rep(${k})">تکرار این سفارش</button></div>`).join(""):"")}
if(k=="help"){const ph=(SET.phone||"09933930454").replace(/\D/g,""),fq=(SET.faq||"").split("\n").filter(l=>l.includes("|"));h=`<h3>پشتیبانی <button class="x" onclick="closeSheet()">✕</button></h3>${SET.hours?`<p>⏰ ساعت کاری: ${esc(SET.hours)}</p>`:""}<a class="go" href="tel:${ph}">📞 تماس تلفنی</a><a class="go wa" href="https://wa.me/98${ph.replace(/^0/,"")}">💬 پیام در واتساپ</a>${SET.instagram?`<a class="go" style="background:var(--gd)" href="${esc(SET.instagram)}" target="_blank" rel="noopener">📷 صفحه اینستاگرام وستا</a>`:""}${fq.length?`<h3 style="display:block;margin-top:14px">سؤالات متداول</h3>`+fq.map(l=>{const [a,...b]=l.split("|");return `<details><summary>${esc(a)}</summary><p>${esc(b.join("|"))}</p></details>`}).join(""):""}${SET.rules?`<details style="margin-top:8px"><summary>قوانین و شرایط خرید</summary><p style="white-space:pre-line">${esc(SET.rules)}</p></details>`:""}`}
return h}
async function order(){const n=$("#cn").value.trim(),p=en($("#cp").value.trim()),a=$("#ca").value.trim();const u0=ls.g("vs_cu",{});ls.s("vs_cu",{...u0,n,p,a,as:[...new Set([a,...(u0.as||[])])].slice(0,4)});
 if(n.length<3)err="نام خود را بنویسید.";else if(!/^09\d{9}$/.test(p))err="شماره موبایل را درست بنویسید (مثل ۰۹۱۲۳۴۵۶۷۸۹).";else if(a.length<8)err="آدرس را کامل بنویسید.";else err="";
 if(err)return render();
 const items=Object.entries(cart).map(([i,k])=>{const x=P.find(y=>y.id==i);return{id:x.id,name:x.name,qty:k,price:pe(x),cp:x.consumer_price}}),total=items.reduce((s,i)=>s+i.price*i.qty,0);
 $("#go").disabled=true;$("#go").textContent="در حال ثبت...";
 const r=await sb.rpc("place_order",{p_name:n,p_phone:p,p_address:a,p_items:items.map(i=>({id:i.id,qty:i.qty})),p_time:$("#ct").value,p_note:$("#cm").value.trim()});
 if(r.error){err=/Failed|fetch|network/i.test(r.error.message)?"ثبت سفارش انجام نشد. اینترنت را چک کنید.":r.error.message;load();return render()}lastId=r.data;
 hist.unshift({id:lastId,d:new Date().toISOString(),total,items});ls.s("vs_hist",hist.slice(0,15));cart={};ls.s("vs_cart",cart);openSheet("done");render()}
function mini(x){return `<button class="mn" onclick="detail(${x.id})">${x.image_url?`<img src="${esc(x.image_url)}" alt="" loading="lazy">`:`<span class="mi">وستا</span>`}<small>${esc(x.name)}</small><b>${fa(pe(x))}</b></button>`}
function stripMini(t,a){return a.length?`<div class="sec"><h3>${t}</h3></div><div class="cr">${a.map(mini).join("")}</div>`:""}
function strip(t,a){return a.length?`<div class="sec"><h3>${t}</h3></div><div class="hs">${a.map(card).join("")}</div>`:""}
function catNames(c){const n=CT.find(x=>x.name==c);return[c,...CT.filter(x=>n&&x.parent_id==n.id).map(x=>x.name)]}
async function openOrders(p){p=en(p||(ls.g("vs_cu",{}).p)||"");msg="";TR=[];page="orders";render();window.scrollTo(0,0);if(/^09\d{9}$/.test(p)){ls.s("vs_cu",{...ls.g("vs_cu",{}),p});const r=await sb.rpc("track_orders",{p_phone:p});if(r.error)msg="دریافت سفارش‌ها انجام نشد.";else{TR=r.data;if(!TR.length)msg="سفارشی با این شماره پیدا نشد."}}else if(p)msg="شماره موبایل را درست بنویسید.";render()}
async function cx(id){if(!confirm("این سفارش لغو شود؟"))return;const r=await sb.rpc("cancel_order",{p_id:id,p_phone:ls.g("vs_cu",{}).p});const ok=!r.error&&r.data;await openOrders();msg=ok?"سفارش لغو شد.":"لغو انجام نشد؛ سفارش در حال آماده‌سازی است. با پشتیبانی تماس بگیرید.";render()}
function shr(id){const u=location.origin+location.pathname+"?p="+id;if(navigator.share)navigator.share({title:"وستا",url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u)}catch(e){}alert("لینک کپی شد")}}
window.addEventListener("offline",()=>$("#of").hidden=false);window.addEventListener("online",()=>{$("#of").hidden=true;load()});
function saveForm(){if($("#cn")){const u=ls.g("vs_cu",{});ls.s("vs_cu",{...u,n:$("#cn").value,p:$("#cp").value,a:$("#ca").value})}}
function go(p){if(page=="home")scr=window.scrollY;closeSheet();page=p;if(p=="orders")openOrders();else{render();window.scrollTo(0,p=="home"?scr:0)}}
function bdg(){const c=Object.values(cart).reduce((a,n)=>a+n,0),seen=ls.g("vs_seen",0),nw=N.filter(n=>n.id>seen).length;$("#nb").hidden=!c;$("#nb").textContent=fa(c);$("#bg").hidden=!nw;$("#bg").textContent=fa(nw)}
function ci(c){const m=c.image_url||(P.find(p=>p.image_url&&catNames(c.name).includes(p.category))||{}).image_url;return m?`<img src="${esc(m)}" alt="">`:esc(c.icon||"🛒")}
async function hard(){try{localStorage.removeItem("vs_p")}catch(e){}try{const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}catch(e){}location.href=location.pathname+"?v="+Date.now()}
$("#rf").onclick=()=>{$("#rf").classList.add("spin");load().then(()=>setTimeout(()=>$("#rf").classList.remove("spin"),600))};
(function(){const sp=$("#sp"),t=new Date().toDateString();if(ls.g("vs_sp","")==t){sp.remove();return}ls.s("vs_sp",t);sp.querySelector("img").src=document.querySelector(".tp img").src;setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),600)},2200)})();
function detail(id){dtid=id;openSheet("detail")}
function tf(id){fav=fav.includes(id)?fav.filter(i=>i!=id):[...fav,id];ls.s("vs_fav",fav);render()}
function rep(k){hist[k].items.forEach(i=>{const x=P.find(y=>y.id==i.id);if(x&&x.stock>0)cart[x.id]=Math.min(x.stock,i.qty)});ls.s("vs_cart",cart);go("cart")}
$("#m").addEventListener("click",e=>{const c=e.target.closest(".cd");if(c&&e.target.closest(".im,.nm"))detail(+c.dataset.id)});
$("#q").oninput=e=>{q=e.target.value.trim();render()};
$("#bar").onclick=()=>openSheet("cart");
$("#bl").onclick=()=>{ls.s("vs_seen",Math.max(0,...N.map(n=>n.id)));openSheet("notif");render()};
$("#ov").onclick=e=>{if(e.target.id=="ov")closeSheet()};
setInterval(()=>document.querySelectorAll("[data-e]").forEach(e=>{const r=e.dataset.e-Date.now();r<=0?load():e.textContent=cd(r)}),1000);
setInterval(()=>{if(!document.hidden&&!sheet)load()},60000);
render();load().then(()=>{const p=+new URLSearchParams(location.search).get("p");if(p&&P.find(x=>x.id==p))detail(p)});
