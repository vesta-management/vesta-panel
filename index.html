<title>پنل مدیریت وستا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F6F4EE;--sf:#fff;--ink:#0E1B45;--mute:#6B7390;--navy:#14286B;--gold:#B8892B;--gs:#F3E6C4;--line:#E3DFD2;--ok:#1F7A4D;--bad:#B3261E;--warn:#B3501C;--ws:#FBE3D3}
@media (prefers-color-scheme:dark){:root{--bg:#0B1230;--sf:#142048;--ink:#F2EEE0;--mute:#9AA3C4;--navy:#E3C478;--gold:#E3C478;--gs:#3A3220;--line:#26336B;--ok:#5FD39A;--bad:#FF8A80;--warn:#F0A074;--ws:#3D2A1E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Vazirmatn,sans-serif;font-size:15px;line-height:1.7}
header{background:#14286B;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid #C9A24B}
header img{width:44px;height:44px;border-radius:50%}header small{opacity:.8;display:block;font-size:12px}
nav{display:flex;gap:6px;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;border:1px solid var(--line);background:var(--sf);color:var(--ink);padding:9px 2px;border-radius:10px;font:inherit;font-size:14px}
nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
main{padding:4px 12px 40px;max-width:760px;margin:auto}
.row{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.f{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between;align-items:flex-start}.w{flex-wrap:wrap}
.m{color:var(--mute);font-size:13px}.pr{font-weight:bold;color:var(--navy)}.old{text-decoration:line-through;color:var(--mute);font-size:12px;font-weight:normal}
.tag{display:inline-block;background:var(--gs);color:var(--gold);font-size:12px;padding:0 8px;border-radius:20px}
.pill{font-size:12px;padding:1px 10px;border-radius:20px;white-space:nowrap;background:var(--ws);color:var(--warn)}.pill.g{background:#D6F2E3;color:#1F7A4D}.pill.b{background:#DCE6FF;color:#14286B}.pill.r{background:#FDE0DD;color:var(--bad)}
button.s{border:1px solid var(--line);background:none;color:var(--ink);padding:5px 12px;border-radius:8px;font:inherit;font-size:13px}
button.s.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.fab{width:100%;border:0;background:#14286B;color:#fff;padding:12px;border-radius:12px;font:inherit;font-weight:bold;margin-bottom:10px}
.alert{background:var(--ws);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.err{color:var(--bad);font-size:13px;min-height:20px}
.th{width:60px;height:60px;border-radius:10px;background:var(--gs);object-fit:cover;flex:none;display:grid;place-items:center;font-size:12px;color:var(--mute)}
#login{max-width:340px;margin:60px auto;text-align:center;padding:0 16px}#login img{width:110px;border-radius:50%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:start}
.toast{position:fixed;inset-inline:16px;bottom:16px;background:#14286B;color:#fff;padding:10px 14px;border-radius:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
@media print{header,nav,.noprint,.row:not(#invc){display:none!important}}

#invp{position:fixed;inset:0;z-index:50;background:#e9e9e9;overflow:auto;padding:10px}
#invp .pg{background:#fff;color:#000;max-width:800px;margin:auto;padding:14px;font-size:12px;line-height:1.7}
#invp .bx{border:1px solid #888;border-radius:8px;margin-bottom:8px;overflow:hidden}#invp .bh{background:#eee;text-align:center;font-weight:bold;padding:3px;border-bottom:1px solid #888}#invp .bb{padding:6px 10px}
#invp table{width:100%;border-collapse:collapse}#invp th,#invp td{border:1px solid #888;padding:4px;text-align:center;font-size:11px}#invp th{background:#eee}
#invp .tl{display:flex;gap:8px}#invp .tl>div{flex:1}#invp .tb td{text-align:start}
@media print{@page{size:A4;margin:8mm}body>*:not(#invp){display:none!important}#invp{position:static;background:#fff;padding:0}#invp .noprint{display:none!important}#invp .pg{max-width:none;padding:0}}
</style>

async function load(){
 const [p,o,n]=await Promise.all([sb.from("products").select("*").order("id"),sb.from("orders").select("*").order("created_at",{ascending:false}).limit(100),sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(30)]);
 if(p.error||o.error||n.error){toast("خطا در دریافت اطلاعات: "+((p.error||o.error||n.error).message));return}
 P=p.data;O=o.data;N=n.data;view()}
function view(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 const nw=O.filter(o=>o.status=="new").length,lw=P.filter(low),ou=P.filter(x=>!x.stock);
 let h="";
 if(lw.length||ou.length)h+=`<div class="alert"><b>هشدار موجودی</b><br>${lw.map(x=>`فقط ${fa(x.stock)} عدد از «${esc(x.name)}» مانده`).concat(ou.map(x=>`«${esc(x.name)}» تمام شده و ناموجود است`)).join("<br>")}</div>`;
 if(tab=="orders"){
  if(iv){const o=O.find(x=>x.id==iv);h+=`<div class="row" id="invc"><div style="text-align:center"><img src="${$("header img").src}" style="width:64px;border-radius:50%"><h3 style="margin:4px 0">پیش‌فاکتور · تأمین گستر وستا</h3></div><div class="m">شماره سفارش: ${fa(o.id)} · ${new Date(o.created_at).toLocaleDateString("fa-IR")}</div><div>مشتری: <b>${esc(o.customer_name)}</b> · ${esc(o.phone)}</div><div>آدرس: ${esc(o.address)}</div><table><tr><th>کالا</th><th>تعداد</th><th>قیمت</th><th>جمع</th></tr>${(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${fa(i.qty)}</td><td>${fa(i.price)}</td><td>${fa(i.price*i.qty)}</td></tr>`).join("")}</table><div class="pr" style="margin-top:8px">جمع کل: ${fa(o.total)} تومان</div><div class="m">ارسال رایگان · پرداخت در محل</div><div class="f noprint" style="margin-top:8px"><button class="s on" onclick="window.print()">چاپ / PDF</button><button class="s" onclick="iv=null;view()">بستن</button></div></div>`}
  h+=O.length?O.map(o=>`<div class="row"><div class="f sp"><div><b>سفارش ${fa(o.id)} · ${esc(o.customer_name)}</b><div class="m">${esc(o.phone)} · ${esc(o.address)}</div></div><span class="pill ${SC[o.status]}">${ST[o.status]}</span></div><div class="m" style="margin-top:6px">${(o.items||[]).map(i=>esc(i.name)+" × "+fa(i.qty)).join("، ")}</div><div class="f sp" style="margin-top:6px"><span class="pr">${fa(o.total)} تومان</span><span class="f"><button class="s" onclick="inv(${o.id})">فاکتور</button>${o.status!="delivered"?`<button class="s on" onclick="adv(${o.id})">${o.status=="new"?"تحویل به پیک":"ثبت تحویل"}</button>`:""}</span></div></div>`).join(""):`<div class="m" style="text-align:center;padding:30px">هنوز سفارشی ثبت نشده.</div>`}
 if(tab=="products"){
  if(ed!==null){const x=ed?P.find(y=>y.id==ed):{name:"",category:CATS[0],consumer_price:"",vesta_price:"",stock:"",low_alert:5};
   h+=`<div class="row"><b>${ed?"ویرایش کالا":"کالای جدید"}</b><div class="f" style="margin:8px 0"><div class="th" id="pv">${prev?`<img class="th" src="${esc(prev)}">`:"عکس"}</div><input type="file" accept="image/*" onchange="pic(event)"></div><label>نام کالا</label><input id="fn" value="${esc(x.name)}"><label>دسته‌بندی</label><select id="fc">${CATS.map(c=>`<option ${c==x.category?"selected":""}>${c}</option>`).join("")}</select><div class="two"><div><label>قیمت مصرف‌کننده</label><input id="fcp" type="number" value="${x.consumer_price}"></div><div><label>قیمت ویژه وستا</label><input id="fvp" type="number" value="${x.vesta_price}"></div><div><label>موجودی</label><input id="fs" type="number" value="${x.stock}"></div><div><label>هشدار در موجودی</label><input id="fl" type="number" value="${x.low_alert}"></div></div><div class="err" id="er"></div><div class="f"><button class="fab" style="flex:2;margin:0" onclick="sv()">ذخیره</button><button class="s" style="flex:1" onclick="ed=null;view()">انصراف</button></div></div>`}
  else if(fd){const x=P.find(y=>y.id==fd);h+=`<div class="row"><b>تخفیف ۲۴ ساعته</b><div class="m">${esc(x.name)} · قیمت ویژه: ${fa(x.vesta_price)}</div><label>قیمت تخفیف (کمتر از قیمت ویژه)</label><input id="ffp" type="number"><div class="err" id="er"></div><div class="f"><button class="fab" style="flex:2;margin:0" onclick="fs()">شروع</button><button class="s" style="flex:1" onclick="fd=null;view()">انصراف</button></div></div>`}
  else h+=`<button class="fab" onclick="blob=null;prev='';ed=0;view()">افزودن کالای جدید</button>`;
  h+=P.map(x=>`<div class="row"><div class="f">${x.image_url?`<img class="th" src="${esc(x.image_url)}">`:`<div class="th">بدون عکس</div>`}<div style="flex:1;min-width:0"><div class="f sp"><b>${esc(x.name)}</b>${!x.stock?'<span class="pill r">ناموجود</span>':low(x)?'<span class="pill">رو به اتمام</span>':""}</div><div class="m"><span class="tag">${esc(x.category)}</span> موجودی: ${fa(x.stock)}</div><div class="pr">${fa(pe(x))} <span class="old">${fa(x.consumer_price)}</span> <span class="tag">${fa(dis(x))}٪ تخفیف</span></div>${fl(x)?`<div class="m" style="color:var(--warn)">تخفیف ۲۴ ساعته · <span data-e="${new Date(x.flash_ends).getTime()}">${cd(new Date(x.flash_ends)-Date.now())}</span> مانده</div>`:""}</div></div><div class="f w" style="margin-top:8px"><button class="s ${fl(x)?"on":""}" onclick="df(${x.id})">${fl(x)?"پایان تخفیف ۲۴ ساعته":"تخفیف ۲۴ ساعته"}</button><button class="s" onclick="blob=null;prev='${esc(x.image_url||"")}';ed=${x.id};view()">ویرایش</button><button class="s" style="color:var(--bad)" onclick="rm(${x.id})">حذف</button></div></div>`).join("")}

 $("#main").innerHTML=h}
const er=m=>{const e=$("#er");if(e)e.textContent=m};
async function adv(id){const o=O.find(x=>x.id==id);
 if(o.status=="new")for(const i of o.items||[]){const x=P.find(y=>y.id==i.id);if(x)await sb.from("products").update({stock:Math.max(0,x.stock-i.qty)}).eq("id",x.id)}

 toast(r.error?"خطا: "+r.error.message:o.status=="new"?"به پیک تحویل شد و از موجودی کم شد":"تحویل ثبت شد");load()}
function df(id){const x=P.find(y=>y.id==id);if(fl(x)){sb.from("products").update({flash_price:null,flash_ends:null}).eq("id",id).then(()=>{toast("تخفیف تمام شد");load()})}else{fd=id;view()}}
async function fs(){const x=P.find(y=>y.id==fd),v=+$("#ffp").value;if(!(v>0&&v<x.vesta_price))return er("قیمت باید کمتر از قیمت ویژه وستا باشد.");
 const r=await sb.from("products").update({flash_price:v,flash_ends:new Date(Date.now()+864e5).toISOString()}).eq("id",fd);if(r.error)return er(r.error.message);fd=null;toast("تخفیف ۲۴ ساعته شروع شد");load()}
async function rm(id){if(!confirm("این کالا حذف شود؟"))return;const r=await sb.from("products").delete().eq("id",id);toast(r.error?"خطا: "+r.error.message:"حذف شد");load()}
function pic(e){const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{blob=b;prev=URL.createObjectURL(b);$("#pv").innerHTML=`<img class="th" src="${prev}">`},"image/jpeg",.8)};i.src=URL.createObjectURL(f)}
async function sv(){const d={name:$("#fn").value.trim(),category:$("#fc").value,consumer_price:+$("#fcp").value,vesta_price:+$("#fvp").value,stock:+$("#fs").value,low_alert:+$("#fl").value};
 if(!d.name)return er("نام کالا را بنویسید.");if(!(d.consumer_price>0&&d.vesta_price>0))return er("هر دو قیمت را وارد کنید.");if(d.vesta_price>=d.consumer_price)return er("قیمت ویژه وستا باید کمتر از قیمت مصرف‌کننده باشد.");
 er("در حال ذخیره...");
 if(blob){const path="p_"+Date.now()+".jpg",u=await sb.storage.from("product-images").upload(path,blob,{contentType:"image/jpeg"});if(u.error)return er("خطا در آپلود عکس: "+u.error.message);d.image_url=sb.storage.from("product-images").getPublicUrl(path).data.publicUrl}
 const r=ed?await sb.from("products").update(d).eq("id",ed):await sb.from("products").insert(d);if(r.error)return er(r.error.message);ed=null;toast("کالا ذخیره شد");load()}
async function sn(){const t=$("#nt").value.trim(),b=$("#nb").value.trim();if(!t||!b)return toast("عنوان و متن را بنویسید");const r=await sb.from("notifications").insert({title:t,body:b});toast(r.error?"خطا: "+r.error.message:"اعلان ثبت شد");load()}
async function chPw(){const a=$("#p0").value,b=$("#p1").value,c=$("#p2").value,s=(await sb.auth.getSession()).data.session;
 if(b.length<6)return er("رمز جدید حداقل ۶ کاراکتر باشد.");if(b!=c)return er("تکرار رمز یکی نیست.");
 const t=await sb.auth.signInWithPassword({email:s.user.email,password:a});if(t.error)return er("رمز فعلی درست نیست.");
 const r=await sb.auth.updateUser({password:b});if(r.error)return er(r.error.message);toast("رمز عوض شد");view()}

const U=["","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه","ده","یازده","دوازده","سیزده","چهارده","پانزده","شانزده","هفده","هجده","نوزده"],TT=["","","بیست","سی","چهل","پنجاه","شصت","هفتاد","هشتاد","نود"],HH=["","صد","دویست","سیصد","چهارصد","پانصد","ششصد","هفتصد","هشتصد","نهصد"],SS=["","هزار","میلیون","میلیارد","هزار میلیارد"];
function w3(n){const h=n/100|0,r=n%100,p=[];if(h)p.push(HH[h]);if(r){if(r<20)p.push(U[r]);else{const u=r%10;p.push(u?TT[r/10|0]+" و "+U[u]:TT[r/10|0])}}return p.join(" و ")}
function words(n){if(!n)return"صفر";const g=[];let i=0;while(n>0){const x=n%1000;if(x)g.unshift(w3(x)+(SS[i]?" "+SS[i]:""));n=Math.floor(n/1000);i++}return g.join(" و ")}
function inv(id){const o=O.find(x=>x.id==id),R=n=>fa(n*10);let gross=0,disc=0,qty=0;
 const rows=(o.items||[]).map((i,k)=>{const x=P.find(y=>y.id==i.id),cp=i.cp||(x&&x.consumer_price)||i.price,ud=Math.max(0,cp-i.price),pc=cp?Math.round(ud/cp*100):0;gross+=cp*i.qty;disc+=ud*i.qty;qty+=i.qty;
  return `<tr><td>${fa(k+1)}</td><td>${fa(i.id)}</td><td style="text-align:start">${esc(i.name)}</td><td>${fa(i.qty)} عدد</td><td>${R(cp)}</td><td>${R(ud)}</td><td>${fa(pc)}٪</td><td>${R(i.price*i.qty)}</td></tr>`}).join("");
 const pay=gross-disc,d=new Date(o.created_at),dt=d.toLocaleDateString("fa-IR")+" - "+d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
 $("#invp").innerHTML=`<div class="noprint" style="max-width:800px;margin:0 auto 8px;display:flex;gap:8px"><button class="fab" style="margin:0;flex:2" onclick="window.print()">چاپ / ذخیره PDF</button><button class="s" style="flex:1;background:#fff" onclick="$('#invp').hidden=true">بستن</button></div>
 <div class="pg"><div class="bx"><div class="bb" style="display:flex;align-items:center;justify-content:space-between"><img src="${$("header img").src}" style="width:70px;border-radius:50%"><div style="text-align:center"><b style="font-size:17px">${SELLER.name}</b><div><b>فاکتور فروش</b></div></div><div>فاکتور شماره ${fa(o.id)}<br>تاریخ: ${dt}</div></div></div>
 <div class="tl"><div class="bx"><div class="bh">فروشنده</div><div class="bb">${SELLER.name}<br>${SELLER.addr}<br>${fa(SELLER.tel)}</div></div><div class="bx"><div class="bh">خریدار</div><div class="bb">${esc(o.customer_name)}<br>${esc(o.address)}<br>${esc(o.phone)}</div></div></div>
 <div class="bx"><table><tr><th>ردیف</th><th>کد کالا</th><th>شرح کالا/خدمات</th><th>مقدار</th><th>فی</th><th>تخفیف واحد</th><th>درصد تخفیف</th><th>جمع (ریال)</th></tr>${rows}</table></div>
 <div class="tl"><div class="bx"><div class="bh">توضیحات</div><div class="bb">ارسال رایگان · پرداخت در محل هنگام تحویل</div></div><div class="bx"><table class="tb"><tr><td>جمع کل</td><td>${R(gross)}</td></tr><tr><td>دریافتی</td><td>۰</td></tr><tr><td>تخفیف سطری</td><td>${R(disc)}</td></tr><tr><td><b>قابل پرداخت</b></td><td><b>${R(pay)} ریال</b></td></tr><tr><td>جمع اقلام</td><td>${fa(qty)}</td></tr><tr><td colspan="2">قابل پرداخت: ${words(pay*10)} ریال</td></tr></table></div></div>
 <div class="tl"><div class="bx" style="min-height:130px"><div class="bh">امضا خریدار</div></div><div class="bx" style="min-height:130px"><div class="bh">امضا فروشنده</div><div style="text-align:center"><img src="${STAMP}" style="width:110px"></div></div></div></div>`;$("#invp").hidden=false;$("#invp").scrollTop=0}
async function out(){await sb.auth.signOut();location.reload()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;ed=fd=iv=null;view()});
$("#lb").onclick=async()=>{$("#le").textContent="";const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(r.error)return $("#le").textContent="ایمیل یا رمز درست نیست.";start()};
$("#pw").onkeydown=e=>{if(e.key=="Enter")$("#lb").click()};
function start(){$("#login").hidden=true;$("#app").hidden=false;load();
 setInterval(()=>document.querySelectorAll("[data-e]").forEach(e=>{const r=e.dataset.e-Date.now();r<=0?load():e.textContent=cd(r)}),1000);
 setInterval(()=>{if(tab=="orders"&&!iv&&!document.hidden)load()},30000)}
sb.auth.getSession().then(({data})=>{data.session?start():$("#login").hidden=false});
</script>
