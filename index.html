<style>
:root{--bg:#F6F4EE;--sf:#fff;--ink:#0E1B45;--mute:#6B7390;--navy:#14286B;--gold:#B8892B;--gs:#F3E6C4;--line:#E3DFD2;--ok:#1F7A4D;--bad:#B3261E;--warn:#B3501C;--ws:#FBE3D3}
@media (prefers-color-scheme:dark){:root{--bg:#0B1230;--sf:#142048;--ink:#F2EEE0;--mute:#9AA3C4;--navy:#E3C478;--gold:#E3C478;--gs:#3A3220;--line:#26336B;--ok:#5FD39A;--bad:#FF8A80;--warn:#F0A074;--ws:#3D2A1E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Vazirmatn,sans-serif;font-size:15px;line-height:1.7}
header{background:#14286B;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid #C9A24B}
header img{width:44px;height:44px;border-radius:50%}header small{opacity:.8;display:block;font-size:12px}
nav{display:flex;overflow-x:auto;gap:6px;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1 0 auto;min-width:62px;border:1px solid var(--line);background:var(--sf);color:var(--ink);padding:9px 1px;border-radius:10px;font:inherit;font-size:12px}
nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
main{padding:4px 12px 40px;max-width:760px;margin:auto}
.row{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.f{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between;align-items:flex-start}.w{flex-wrap:wrap}
.m{color:var(--mute);font-size:13px}.pr{font-weight:bold;color:var(--navy)}.old{text-decoration:line-through;color:var(--mute);font-size:12px;font-weight:normal}
.tag{display:inline-block;background:var(--gs);color:var(--gold);font-size:12px;padding:0 8px;border-radius:20px}
.pill{font-size:12px;padding:1px 10px;border-radius:20px;white-space:nowrap;background:var(--ws);color:var(--warn)}.pill.g{background:#D6F2E3;color:#1F7A4D}.pill.b{background:#DCE6FF;color:#14286B}.pill.r{background:#FDE0DD;color:var(--bad)}
button.s{border:1px solid var(--line);background:none;color:var(--ink);padding:5px 12px;border-radius:8px;font:inherit;font-size:13px}
button.s.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.fab{width:100%;border:0;background:#14286B;color:#fff;padding:12px;border-radius:12px;font:inherit;font-weight:bold;margin-bottom:10px}
.alert{background:var(--ws);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.err{color:var(--bad);font-size:13px;min-height:20px}
.th{width:60px;height:60px;border-radius:10px;background:var(--gs);object-fit:cover;flex:none;display:grid;place-items:center;font-size:12px;color:var(--mute)}
#login{max-width:340px;margin:60px auto;text-align:center;padding:0 16px}#login img{width:110px;border-radius:50%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:start}
.toast{position:fixed;inset-inline:16px;bottom:16px;background:#14286B;color:#fff;padding:10px 14px;border-radius:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
@media print{header,nav,.noprint,.row:not(#invc){display:none!important}}

#invp{position:fixed;inset:0;z-index:50;background:#e9e9e9;overflow:auto;padding:10px}
#invp .pg{background:#fff;color:#000;max-width:560px;margin:0 auto 12px;padding:10px;font-size:10.5px;line-height:1.6;break-after:page}
#invp .bx{border:1px solid #888;border-radius:8px;margin-bottom:8px;overflow:hidden}#invp .bh{background:#eee;text-align:center;font-weight:bold;padding:3px;border-bottom:1px solid #888}#invp .bb{padding:6px 10px}
#invp table{width:100%;border-collapse:collapse}#invp th,#invp td{border:1px solid #888;padding:3px;text-align:center;font-size:10px}#invp th{background:#eee}
#invp .tl{display:flex;gap:8px}#invp .tl>div{flex:1}#invp .tb td{text-align:start}
@media print{@page{size:A5;margin:6mm}body>*:not(#invp){display:none!important}#invp{position:static;background:#fff;padding:0}#invp .noprint{display:none!important}#invp .pg{max-width:none;padding:0;margin:0}#invp .pg:last-child{break-after:auto}}
#nob{position:fixed;top:0;inset-inline:0;z-index:60;background:#C62828;color:#fff;text-align:center;padding:12px;font-weight:bold;cursor:pointer}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.sg>div{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.sg b{display:block;font-size:20px;color:var(--navy)}.sg span{font-size:12px;color:var(--mute)}
</style>
</head>

const SB_URL="https://zbfdagmsuotdnflugmsv.supabase.co",SB_KEY="sb_publishable_szKwJtt2HTzWP8QoVlGdfg_0IHmaq65";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),fa=n=>Math.round(+n||0).toLocaleString("fa-IR");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CATS=["مواد غذایی","شوینده","بهداشتی","سلولزی"];const ST={new:"جدید",preparing:"در حال آماده‌سازی",shipping:"تحویل پیک شد",delivered:"تحویل شد",cancelled:"لغو شد"},SC={new:"",preparing:"b",shipping:"b",delivered:"g",cancelled:"r"};
let AL=[],STT=null,known=0,dd1="",dd2="",FB=[],SL={},CT=[],BN=[],SET={},P=[],O=[],N=[],tab="orders",ed=null,fd=null,iv=null,blob=null,prev="";
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)};
const fl=x=>x.flash_price>0&&x.flash_ends&&new Date(x.flash_ends)>Date.now(),pe=x=>fl(x)?x.flash_price:x.vesta_price;
const dis=x=>Math.round((1-pe(x)/x.consumer_price)*100),low=x=>x.stock>0&&x.stock<=x.low_alert;
const D="۰۱۲۳۴۵۶۷۸۹",cd=ms=>{const s=Math.max(0,Math.floor(ms/1000));return [s/3600|0,s%3600/60|0,s%60].map(v=>String(v).padStart(2,"0").replace(/\d/g,d=>D[d])).join(":")};
async function load(){
 const [p,o,n]=await Promise.all([sb.from("products").select("*").order("id"),sb.from("orders").select("*").order("created_at",{ascending:false}).limit(100),sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(30)]);
 if(p.error||o.error||n.error){toast("خطا در دریافت اطلاعات: "+((p.error||o.error||n.error).message));return}
 P=p.data;O=o.data;N=n.data;
 const c=await sb.from("categories").select("*").order("sort");if(!c.error){CT=c.data.filter(x=>x.name!="سایر");if(CT.length)CATS=CT.map(x=>x.name)}
 const b=await sb.from("banners").select("*").order("sort");if(!b.error)BN=b.data;
 const s=await sb.from("settings").select("*").limit(1);if(!s.error&&s.data[0])SET=s.data[0];
 const f=await sb.from("feedback").select("*").order("created_at",{ascending:false}).limit(100);if(!f.error)FB=f.data;
 const sl=await sb.rpc("sales_counts");if(!sl.error)SL=Object.fromEntries(sl.data.map(r=>[r.pid,+r.qty]));
 const al=await sb.from("stock_alerts").select("*");if(!al.error)AL=al.data;
 if(O.length)known=Math.max(known,O[0].id);const ob=document.querySelector("[data-t=orders]");if(ob){const n=O.filter(x=>x.status=="new").length;ob.textContent="سفارش‌ها"+(n?" ("+fa(n)+")":"")}
 const nb=document.querySelector("[data-t=fb]");if(nb){const n=FB.filter(x=>!x.read).length;nb.textContent="نظرات"+(n?" ("+fa(n)+")":"")}view()}
function view(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));

 let h="";
 if(lw.length||ou.length)h+=`<div class="alert"><b>هشدار موجودی</b><br>${lw.map(x=>`فقط ${fa(x.stock)} عدد از «${esc(x.name)}» مانده`).concat(ou.map(x=>`«${esc(x.name)}» تمام شده و ناموجود است`)).join("<br>")}</div>`;
 if(tab=="orders"){h+=ordTools();
  if(iv){const o=O.find(x=>x.id==iv);h+=`<div class="row" id="invc"><div style="text-align:center"><img src="${$("header img").src}" style="width:64px;border-radius:50%"><h3 style="margin:4px 0">پیش‌فاکتور · تأمین گستر وستا</h3></div><div class="m">شماره سفارش: ${fa(o.id)} · ${new Date(o.created_at).toLocaleDateString("fa-IR")}</div><div>مشتری: <b>${esc(o.customer_name)}</b> · ${esc(o.phone)}</div><div>آدرس: ${esc(o.address)}</div><table><tr><th>کالا</th><th>تعداد</th><th>قیمت</th><th>جمع</th></tr>${(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${fa(i.qty)}</td><td>${fa(i.price)}</td><td>${fa(i.price*i.qty)}</td></tr>`).join("")}</table><div class="pr" style="margin-top:8px">جمع کل: ${fa(o.total)} تومان</div><div class="m">ارسال رایگان · پرداخت در محل</div><div class="f noprint" style="margin-top:8px"><button class="s on" onclick="window.print()">چاپ / PDF</button><button class="s" onclick="iv=null;view()">بستن</button></div></div>`}
  h+=O.length?O.map(o=>`<div class="row"><div class="f sp"><div><b>سفارش ${fa(o.id)} · ${esc(o.customer_name)}</b><div class="m">${esc(o.phone)} · ${esc(o.address)}</div>${o.delivery_time?`<div class="m">زمان تحویل: ${esc(o.delivery_time)}</div>`:""}${o.note?`<div class="m">توضیحات: ${esc(o.note)}</div>`:""}</div><span class="pill ${SC[o.status]}">${ST[o.status]}</span></div><div class="m" style="margin-top:6px">${(o.items||[]).map(i=>esc(i.name)+" × "+fa(i.qty)).join("، ")}</div><div class="f sp" style="margin-top:6px"><span class="pr">${fa(o.total)} تومان</span><span class="f"><button class="s" onclick="inv(${o.id})">فاکتور</button>${["new","preparing","shipping"].includes(o.status)?`<button class="s on" onclick="adv(${o.id})">${{new:"تأیید سفارش",preparing:"تحویل به پیک",shipping:"ثبت تحویل"}[o.status]}</button>`:""}</span></div></div>`).join(""):`<div class="m" style="text-align:center;padding:30px">هنوز سفارشی ثبت نشده.</div>`}
 if(tab=="products"){
  if(ed!==null){const x=ed?P.find(y=>y.id==ed):{name:"",category:CATS[0],consumer_price:"",vesta_price:"",stock:"",low_alert:5,brand:"",size:"",description:"",active:true};
   h+=`<div class="row"><b>${ed?"ویرایش کالا":"کالای جدید"}</b><div class="f" style="margin:8px 0"><div class="th" id="pv">${prev?`<img class="th" src="${esc(prev)}">`:"عکس"}</div><input type="file" accept="image/*" onchange="pic(event)"></div><label>نام کالا</label><input id="fn" value="${esc(x.name)}"><label>برند</label><input id="fb" value="${esc(x.brand||"")}"><label>وزن / حجم</label><input id="fz" value="${esc(x.size||"")}" placeholder="مثلاً ۱ کیلوگرم"><label>توضیحات</label><textarea id="fdes" rows="2">${esc(x.description||"")}</textarea><label class="f"><input type="checkbox" id="fact" ${x.active!==false?"checked":""} style="width:auto"> نمایش در اپ</label><label>دسته‌بندی</label><select id="fc">${CATS.map(c=>`<option ${c==x.category?"selected":""}>${c}</option>`).join("")}</select><div class="two"><div><label>قیمت مصرف‌کننده</label><input id="fcp" type="number" value="${x.consumer_price}"></div><div><label>قیمت ویژه وستا</label><input id="fvp" type="number" value="${x.vesta_price}"></div><div><label>موجودی</label><input id="fs" type="number" value="${x.stock}"></div><div><label>هشدار در موجودی</label><input id="fl" type="number" value="${x.low_alert}"></div></div><div class="err" id="er"></div><div class="f"><button class="fab" style="flex:2;margin:0" onclick="sv()">ذخیره</button><button class="s" style="flex:1" onclick="ed=null;view()">انصراف</button></div></div>`}

function shopUrl(){return location.origin+location.pathname.replace(/[^/]*$/,"")+"shop.html"}
function qrCard(){return `<div class="row"><b>کد QR اپ مشتری</b><div class="m">برای چاپ روی فاکتور، بسته یا ویترین</div><div class="f" style="margin-top:8px"><button class="s on" onclick="qrShow()">نمایش و چاپ QR</button></div></div>`}
function qrShow(){const q=qrcode(0,"M");q.addData(shopUrl());q.make();$("#invp").innerHTML=`<div class="noprint" style="max-width:560px;margin:0 auto 8px;display:flex;gap:8px"><button class="fab" style="margin:0;flex:2" onclick="window.print()">چاپ (A5)</button><button class="s" style="flex:1;background:#fff" onclick="$('#invp').hidden=true">بستن</button></div><div class="pg" style="text-align:center;padding:20px"><img src="${$("header img").src}" style="width:90px;border-radius:50%"><h2 style="margin:6px 0">${SELLER.name}</h2><div style="width:260px;margin:10px auto">${q.createSvgTag(8,0)}</div><p style="font-size:14px"><b>سفارش آنلاین؛ کد را با دوربین گوشی اسکن کنید</b></p><div dir="ltr" style="font-size:11px;color:#555">${shopUrl()}</div></div>`;$("#invp").hidden=false}
async function up(){if(!blob)return null;const p="x_"+Date.now()+".jpg",u=await sb.storage.from("product-images").upload(p,blob,{contentType:"image/jpeg"});if(u.error){toast("خطا در آپلود عکس");return null}blob=null;return sb.storage.from("product-images").getPublicUrl(p).data.publicUrl}
async function addCat(){const n=$("#cnm").value.trim();if(!n)return er("نام دسته را بنویسید.");const pa=$("#cpa").value,r=await sb.from("categories").insert({name:n,icon:$("#cic").value||"🛒",parent_id:pa?+pa:null,image_url:await up(),sort:CT.length+1});if(r.error)return er(r.error.message);toast("دسته اضافه شد");load()}
async function delCat(id){if(!confirm("این دسته حذف شود؟"))return;await sb.from("categories").delete().eq("id",id);load()}
async function addBan(){const img=await up();if(!img){$("#er2").textContent="عکس بنر را انتخاب کنید.";return}const r=await sb.from("banners").insert({title:"",subtitle:"",category:$("#bca").value,image_url:img,sort:BN.length+1});if(r.error){$("#er2").textContent=r.error.message;return}toast("بنر اضافه شد");load()}
async function delBan(id){await sb.from("banners").delete().eq("id",id);load()}
async function saveSet(){const r=await sb.from("settings").upsert({id:1,instagram:$("#si").value.trim(),phone:$("#sp").value.trim(),hours:$("#sh").value.trim(),notice:$("#sn").value.trim(),rules:$("#sr").value.trim(),faq:$("#sf").value.trim()});toast(r.error?"خطا: "+r.error.message:"ذخیره شد");load()}
async function delN(id){if(!confirm("این اعلان حذف شود؟"))return;const r=await sb.from("notifications").delete().eq("id",id);toast(r.error?"خطا: "+r.error.message:"اعلان حذف شد");load()}
async function markFb(id){await sb.from("feedback").update({read:true}).eq("id",id);load()}
async function delFb(id){if(!confirm("این پیام حذف شود؟"))return;await sb.from("feedback").delete().eq("id",id);load()}
async function out(){await sb.auth.signOut();location.reload()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;ed=fd=iv=null;view();if(tab=="stats")loadStats()});
$("#lb").onclick=async()=>{$("#le").textContent="";const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(r.error)return $("#le").textContent="ایمیل یا رمز درست نیست.";start()};
$("#pw").onkeydown=e=>{if(e.key=="Enter")$("#lb").click()};
function start(){$("#login").hidden=true;$("#app").hidden=false;load();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 setInterval(()=>document.querySelectorAll("[data-e]").forEach(e=>{const r=e.dataset.e-Date.now();r<=0?load():e.textContent=cd(r)}),1000);
 setInterval(poll,15000)}
sb.auth.getSession().then(({data})=>{data.session?start():$("#login").hidden=false});
</script>
</body>
</html>
